<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — englshawy</title>
  <link class="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen bg-zinc-100 text-zinc-900 flex flex-col justify-between overflow-x-hidden selection:bg-indigo-100">

  <!-- Header -->
  <header class="border-b border-zinc-200 bg-white/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-2">
        <span class="text-xl font-bold text-indigo-600">englshawy</span>
      </a>
      <a href="/index.html" class="text-sm font-medium text-zinc-600 hover:text-zinc-900 flex items-center gap-1 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Back Home</span>
      </a>
    </div>
  </header>

  <!-- Login Form Area -->
  <main class="flex-grow flex items-center justify-center py-16 px-6">
    <div class="glass-panel max-w-md w-full p-8 rounded-2xl shadow-sm border-zinc-200 relative z-10">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-4 border border-indigo-100 shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-zinc-800">Admin Sign In</h1>
        <p class="text-xs text-zinc-500 mt-2">Log in to manage quizzes, view submissions and statistics</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-2">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="admin@englshawy.com" 
            class="w-full px-4 py-3 rounded-xl custom-input text-zinc-800 text-sm"
            required
          >
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-2">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••••••" 
            class="w-full px-4 py-3 rounded-xl custom-input text-zinc-800 text-sm font-mono placeholder:font-sans"
            required
          >
        </div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full py-3 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all shadow-sm flex items-center justify-center gap-2"
        >
          <span>Authenticate</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </form>

      <div class="mt-6 text-center text-xs">
        <span class="text-zinc-555">Don't have an account? </span>
        <a href="/signup.html" class="text-indigo-600 hover:text-indigo-800 font-semibold transition-colors">Sign Up</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-200 bg-white py-6 text-center text-xs text-zinc-500">
    <span>© 2026 englshawy. Authorized access only.</span>
  </footer>

  <!-- Controller Script -->
  <script type="module">
    import { initAuthGuard, loginAdmin } from "/js/auth.js";
    import { showLoader, hideLoader, toast } from "/js/ui.js";

    // Route guard
    initAuthGuard(false);

    const loginForm = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        toast.show("Please enter both email and password.", "error");
        return;
      }

      try {
        showLoader();
        submitBtn.disabled = true;
        submitBtn.querySelector("span").textContent = "Authenticating...";
        
        await loginAdmin(email, password);
        window.location.href = "/admin.html";
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.querySelector("span").textContent = "Authenticate";
        hideLoader();
      }
    });
  </script>
</body>
</html>
